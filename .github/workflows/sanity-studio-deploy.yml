name: Sanity Studio Deploy

# Behaviour:
#   - Push to main touching apps/sanity-studio/ AND nothing in web →
#       deploy directly (no dependency on web's E2E).
#   - Push to main touching apps/sanity-studio/ AND web →
#       skip; the web workflow's `promote-to-production` job will
#       re-trigger this workflow via workflow_dispatch once the
#       dev E2E has passed.
#   - workflow_dispatch (manual or from the web workflow) →
#       always deploy.

on:
  push:
    branches: [main]
    paths:
      - "apps/sanity-studio/**"
      - "apps/web/scripts/create-blog-*.ts"
      - "apps/web/src/lib/blog-posts/**"
      - "apps/web/public/images/blog/**"
  workflow_dispatch:
    inputs:
      target_datasets:
        description: "Comma-separated Sanity datasets"
        required: false
        default: production
        type: string

permissions:
  contents: read

jobs:
  publish-canonical-blog-posts:
    runs-on: ubuntu-latest
    name: Publish Canonical Blog Posts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to publish canonical blog posts
        id: decide-publish
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD~1 -- \
            ":(glob)apps/web/scripts/create-blog-*.ts" \
            apps/web/src/lib/blog-posts/ \
            apps/web/public/images/blog/ | grep -q .; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.decide-publish.outputs.should-publish == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.decide-publish.outputs.should-publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.decide-publish.outputs.should-publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish canonical blog posts to Sanity
        if: steps.decide-publish.outputs.should-publish == 'true'
        run: pnpm --filter opticasuarez-web run sync:canonical-blog-posts
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_TARGET_DATASETS: ${{ inputs.target_datasets || 'production' }}

  guard:
    runs-on: ubuntu-latest
    name: Decide whether to deploy
    outputs:
      should-deploy: ${{ steps.decide.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual / cross-workflow trigger — deploying."
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD~1 -- apps/web/ apps/web-e2e/ infra/vercel/web/ | grep -q .; then
            echo "Web changes detected in this commit — deferring to the web workflow, which will dispatch us after dev E2E passes."
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only Sanity Studio changed — deploying directly."
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy Sanity Studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Deploy Sanity Studio
        run: pnpm --filter opticasuarez-sanity-studio run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_GITHUB_DEPLOY_TOKEN: ${{ secrets.SANITY_STUDIO_GITHUB_DEPLOY_TOKEN }}
