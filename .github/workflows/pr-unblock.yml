# PR Unblock
#
# Runs 4 times a day to recover PRs that are stuck in a non-actionable state.
#
# A PR can get stuck when:
#   - It has been approved by a required reviewer, BUT
#   - Auto-merge was automatically disabled by GitHub (common cause:
#     "Head branch was pushed to by a user without write access" — this happens
#     when the Copilot coding agent pushes new commits after auto-merge was
#     initially enabled), AND/OR
#   - One or more required check runs ended in a transient failure.
#
# For every open, non-draft PR this workflow will:
#   1. Re-run any failed check runs on the latest commit (so flaky checks
#      get another chance to go green).
#   2. Re-enable auto-merge (SQUASH) if it is currently disabled — provided
#      the PR has at least one APPROVED review and no CHANGES_REQUESTED
#      reviews. Once re-enabled, GitHub will auto-merge as soon as the
#      required checks pass.
#
# Manual trigger is also supported (workflow_dispatch).

name: PR Unblock

on:
  schedule:
    # Every 6 hours → 4 runs per day (00:15, 06:15, 12:15, 18:15 UTC).
    # The :15 offset avoids the top-of-hour congestion on GitHub Actions.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: pr-unblock
  cancel-in-progress: false

jobs:
  unblock:
    name: Unblock approved PRs with failing or stale state
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed checks and re-enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            if (prs.length === 0) {
              core.info('No open PRs.');
              return;
            }

            for (const pr of prs) {
              const prNumber = pr.number;
              const headSha = pr.head.sha;

              if (pr.draft) {
                core.info(`⏭️  PR #${prNumber} is a draft — skipping.`);
                continue;
              }

              core.info(`\n── PR #${prNumber} (${pr.title}) ──`);

              // ── 1. Re-run failed workflow runs on the head SHA ──
              try {
                const { data: runs } =
                  await github.rest.actions.listWorkflowRunsForRepo({
                    owner,
                    repo,
                    head_sha: headSha,
                    per_page: 100,
                  });

                // Keep only the latest attempt of each workflow on this SHA.
                const latestPerWorkflow = new Map();
                for (const run of runs.workflow_runs) {
                  const prev = latestPerWorkflow.get(run.workflow_id);
                  if (!prev || run.run_number > prev.run_number) {
                    latestPerWorkflow.set(run.workflow_id, run);
                  }
                }

                for (const run of latestPerWorkflow.values()) {
                  const isFailed =
                    run.status === 'completed' &&
                    (run.conclusion === 'failure' ||
                      run.conclusion === 'timed_out' ||
                      run.conclusion === 'cancelled' ||
                      run.conclusion === 'startup_failure');

                  if (!isFailed) continue;

                  try {
                    await github.rest.actions.reRunWorkflowFailedJobs({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                    core.info(
                      `  🔁 Re-ran failed jobs of "${run.name}" (run ${run.id}, conclusion=${run.conclusion}).`
                    );
                  } catch (err) {
                    core.warning(
                      `  ⚠️  Could not re-run "${run.name}" (run ${run.id}): ${err.message}`
                    );
                  }
                }
              } catch (err) {
                core.warning(
                  `  ⚠️  Could not list workflow runs for PR #${prNumber}: ${err.message}`
                );
              }

              // ── 2. Re-enable auto-merge if PR is approved and not blocked ──
              try {
                const { data: reviews } = await github.rest.pulls.listReviews({
                  owner,
                  repo,
                  pull_number: prNumber,
                });

                // Take the most recent review per user.
                const latestByUser = new Map();
                for (const r of reviews) {
                  if (!r.user) continue;
                  latestByUser.set(r.user.login, r);
                }
                const latestReviews = [...latestByUser.values()];
                const hasApproval = latestReviews.some(
                  (r) => r.state === 'APPROVED'
                );
                const hasChangesRequested = latestReviews.some(
                  (r) => r.state === 'CHANGES_REQUESTED'
                );

                if (!hasApproval) {
                  core.info(
                    `  ⏭️  PR #${prNumber} has no approving review — not enabling auto-merge.`
                  );
                  continue;
                }
                if (hasChangesRequested) {
                  core.info(
                    `  ⏭️  PR #${prNumber} has CHANGES_REQUESTED — not enabling auto-merge.`
                  );
                  continue;
                }

                const { repository } = await github.graphql(
                  `
                    query($owner: String!, $repo: String!, $prNumber: Int!) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $prNumber) {
                          id
                          autoMergeRequest { enabledAt }
                        }
                      }
                    }
                  `,
                  { owner, repo, prNumber }
                );

                const prNode = repository.pullRequest;
                if (!prNode) {
                  core.warning(`  ⚠️  Could not load GraphQL node for PR #${prNumber}.`);
                  continue;
                }

                if (prNode.autoMergeRequest) {
                  core.info(`  ✅ Auto-merge already enabled on PR #${prNumber}.`);
                  continue;
                }

                try {
                  await github.graphql(
                    `
                      mutation($pullRequestId: ID!) {
                        enablePullRequestAutoMerge(
                          input: {
                            pullRequestId: $pullRequestId
                            mergeMethod: SQUASH
                          }
                        ) {
                          pullRequest { number }
                        }
                      }
                    `,
                    { pullRequestId: prNode.id }
                  );
                  core.info(`  🔓 Re-enabled auto-merge on PR #${prNumber}.`);
                } catch (err) {
                  core.warning(
                    `  ⚠️  Could not re-enable auto-merge on PR #${prNumber}: ${err.message}`
                  );
                }
              } catch (err) {
                core.warning(
                  `  ⚠️  Could not process reviews/auto-merge for PR #${prNumber}: ${err.message}`
                );
              }
            }
