# PR Unblock
#
# Runs every 6 hours (4× / day) to recover PRs stuck in a non-actionable state.
#
# A PR is "stuck" when it has an approving review but:
#   - One or more required check runs are failing, AND/OR
#   - Auto-merge was automatically disabled by GitHub (common cause:
#     "Head branch was pushed to by a user without write access" — happens
#     when the Copilot coding agent pushes new commits after auto-merge
#     was initially enabled).
#
# State machine (per PR head SHA — resets when a new commit is pushed):
#
#   ┌─ all checks green ─→ ensure auto-merge is enabled, done.
#   │
#   ├─ first time we see failures on this SHA  (no retry marker yet)
#   │     → re-run failed workflow jobs (handles transient/flaky failures)
#   │     → post retry marker comment
#   │
#   └─ failures still present on next pass  (retry marker exists for this SHA)
#         → collect failure annotations + failed step names
#         → @copilot comment asking it to diagnose & fix, with details
#         → post nudge marker comment
#
# Because the marker comments embed the head SHA, every new Copilot commit
# automatically restarts the cycle: retry → diagnose → push fix → retry…
# That's the "keep trying to fix it" loop.

name: PR Unblock

on:
  schedule:
    - cron: "15 */6 * * *" # 4× / day at 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: pr-unblock
  cancel-in-progress: false

jobs:
  unblock:
    name: Recover stuck PRs
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose, retry, escalate, monitor
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const FAILED_CONCLUSIONS = new Set([
              'failure',
              'timed_out',
              'cancelled',
              'startup_failure',
            ]);

            // ── helpers ────────────────────────────────────────────────
            const enableAutoMergeIfApproved = async (pr) => {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number,
              });
              const latestByUser = new Map();
              for (const r of reviews) {
                if (r.user) latestByUser.set(r.user.login, r);
              }
              const latest = [...latestByUser.values()];
              const approved = latest.some((r) => r.state === 'APPROVED');
              const blocked = latest.some((r) => r.state === 'CHANGES_REQUESTED');
              if (!approved || blocked) {
                core.info(`  ⏭️  PR #${pr.number}: approved=${approved} blocked=${blocked} — not enabling auto-merge.`);
                return;
              }

              const { repository } = await github.graphql(
                `query($owner:String!,$repo:String!,$n:Int!){
                   repository(owner:$owner,name:$repo){
                     pullRequest(number:$n){ id autoMergeRequest{ enabledAt } }
                   }
                 }`,
                { owner, repo, n: pr.number },
              );
              const node = repository.pullRequest;
              if (!node) return;
              if (node.autoMergeRequest) {
                core.info(`  ✅ PR #${pr.number}: auto-merge already enabled.`);
                return;
              }
              try {
                await github.graphql(
                  `mutation($id:ID!){
                     enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){
                       pullRequest{ number }
                     }
                   }`,
                  { id: node.id },
                );
                core.info(`  🔓 PR #${pr.number}: re-enabled auto-merge.`);
              } catch (err) {
                core.warning(`  ⚠️  PR #${pr.number}: could not enable auto-merge: ${err.message}`);
              }
            };

            const listRecentComments = async (prNumber) => {
              const { data } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              return data;
            };

            const reRunFailedWorkflows = async (prNumber, headSha) => {
              const { data: runs } =
                await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, head_sha: headSha, per_page: 100,
                });
              // Latest attempt per workflow
              const latest = new Map();
              for (const r of runs.workflow_runs) {
                const prev = latest.get(r.workflow_id);
                if (!prev || r.run_number > prev.run_number) latest.set(r.workflow_id, r);
              }
              let retried = 0;
              for (const run of latest.values()) {
                if (run.status !== 'completed') continue;
                if (!FAILED_CONCLUSIONS.has(run.conclusion)) continue;
                try {
                  await github.rest.actions.reRunWorkflowFailedJobs({
                    owner, repo, run_id: run.id,
                  });
                  core.info(`    🔁 Re-ran "${run.name}" (run ${run.id}, ${run.conclusion}).`);
                  retried++;
                } catch (err) {
                  core.warning(`    ⚠️  Could not re-run "${run.name}" (${run.id}): ${err.message}`);
                }
              }
              return retried;
            };

            const collectFailureDiagnostics = async (headSha) => {
              // Use the Checks API: includes every check run on this SHA.
              const { data: { check_runs } } = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, per_page: 100,
              });
              const failed = check_runs.filter(
                (c) => c.status === 'completed' && FAILED_CONCLUSIONS.has(c.conclusion),
              );
              if (failed.length === 0) return { failed: [], sections: [] };

              const sections = [];
              for (const check of failed) {
                let body = `### ❌ ${check.name} (${check.conclusion})\n`;
                if (check.html_url) body += `[View run](${check.html_url})\n\n`;

                if (check.output && (check.output.title || check.output.summary)) {
                  if (check.output.title) body += `**${check.output.title}**\n\n`;
                  if (check.output.summary) {
                    const summary = check.output.summary.slice(0, 1200);
                    body += `${summary}\n\n`;
                  }
                }

                // Failed step names from the linked Actions job, if any.
                try {
                  const { data: ann } = await github.rest.checks.listAnnotations({
                    owner, repo, check_run_id: check.id, per_page: 20,
                  });
                  if (ann.length > 0) {
                    body += `**Annotations:**\n`;
                    for (const a of ann.slice(0, 10)) {
                      const loc = a.path ? `\`${a.path}\`${a.start_line ? `:${a.start_line}` : ''}` : '';
                      body += `- ${a.annotation_level || 'notice'} ${loc} — ${a.message?.slice(0, 200) || ''}\n`;
                    }
                    body += '\n';
                  }
                } catch (err) {
                  core.warning(`    ⚠️  Could not list annotations for "${check.name}": ${err.message}`);
                }

                sections.push(body);
              }
              return { failed, sections };
            };

            // ── main loop ──────────────────────────────────────────────
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            if (prs.length === 0) {
              core.info('No open PRs.');
              return;
            }

            for (const pr of prs) {
              if (pr.draft) {
                core.info(`⏭️  PR #${pr.number} is draft — skipping.`);
                continue;
              }
              const headSha = pr.head.sha;
              const shortSha = headSha.slice(0, 7);
              const RETRY_MARKER = `<!-- pr-unblock:retry:${shortSha} -->`;
              const NUDGE_MARKER = `<!-- pr-unblock:nudge:${shortSha} -->`;

              core.info(`\n── PR #${pr.number} @ ${shortSha} (${pr.title}) ──`);

              const { failed, sections } = await collectFailureDiagnostics(headSha);

              if (failed.length === 0) {
                core.info('  ✅ No failed checks on this SHA.');
                await enableAutoMergeIfApproved(pr);
                continue;
              }

              core.info(`  ❌ ${failed.length} failed check(s): ${failed.map((f) => f.name).join(', ')}`);

              const comments = await listRecentComments(pr.number);
              const alreadyRetried = comments.some((c) => c.body.includes(RETRY_MARKER));
              const alreadyNudged = comments.some((c) => c.body.includes(NUDGE_MARKER));

              if (!alreadyRetried) {
                // Phase 1: re-run failed workflow jobs (covers flakes).
                const retried = await reRunFailedWorkflows(pr.number, headSha);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: [
                    RETRY_MARKER,
                    `🔁 **PR Unblock — retry pass for \`${shortSha}\`**`,
                    '',
                    `Re-ran ${retried} failed workflow run(s) to rule out flakiness. ` +
                      `If checks are still red on the next scheduled pass (every 6h), ` +
                      `I'll escalate with failure diagnostics and ping @copilot to diagnose & fix.`,
                  ].join('\n'),
                });
                core.info('  📝 Posted retry marker.');
                continue;
              }

              if (alreadyNudged) {
                core.info('  💤 Already nudged @copilot for this SHA — waiting for new commit.');
                continue;
              }

              // Phase 2: escalate to Copilot with diagnostics.
              const diagBody = sections.join('\n').slice(0, 60000); // GitHub comment cap is 65 536.
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  NUDGE_MARKER,
                  `@copilot The retry pass did **not** clear the failing checks on \`${shortSha}\`. ` +
                    `Please **diagnose the root cause** of each failure below, push a fix to this branch, ` +
                    `and keep iterating until all required checks are green.`,
                  '',
                  '### Workflow',
                  '1. Read the failure details below + open the linked runs for full logs.',
                  '2. Reproduce locally with `pnpm check` and `pnpm build`.',
                  '3. Fix the root cause (no `--no-verify`, no skipping tests).',
                  '4. Push the fix. A new scheduled pass will retry/escalate again if needed.',
                  '',
                  '### Failure details',
                  '',
                  diagBody,
                ].join('\n'),
              });
              core.info('  🚨 Escalated to @copilot with diagnostics.');
            }
