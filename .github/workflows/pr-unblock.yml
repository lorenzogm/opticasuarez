# PR Unblock
#
# Goal: keep approved PRs moving until they merge. On every relevant event,
# walk every open non-draft PR and:
#
#   • if all checks are green   → ensure auto-merge is enabled (so GitHub merges
#                                  the PR automatically once required checks pass).
#   • if any checks are failing → immediately
#       1. re-run failed workflow jobs (handles transient/flaky failures), and
#       2. post one comment per head SHA pinging @copilot with the failure
#          diagnostics so it can diagnose and push a fix.
#
# The loop continues until merge:
#
#   trigger ─→ this workflow ─→ ping @copilot ─→ copilot pushes a fix
#       └────────────────────────────────────────────────┘
#                              (synchronize event re-triggers us)
#
# Triggers chosen so we react instantly — no need to wait for the schedule:
#   • pull_request_target (synchronize)      → every new commit on any PR
#   • pull_request_target (opened, reopened, ready_for_review)
#   • pull_request_review (submitted)        → fresh approval flips auto-merge
#   • check_suite        (completed)         → a check just finished
#   • schedule (hourly)                       → safety net
#   • workflow_dispatch                       → manual
#
# We use `pull_request_target` (not `pull_request`) because the workflow needs
# write permissions on PRs from the Copilot coding-agent branches.

name: PR Unblock

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  schedule:
    - cron: "5 * * * *" # hourly safety net
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  # Serialize per repo — comments / auto-merge mutations are global anyway.
  group: pr-unblock
  cancel-in-progress: false

jobs:
  unblock:
    name: Drive approved PRs to merge
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose, retry, ping @copilot, enable auto-merge
        uses: actions/github-script@v7
        with:
          # Use a PAT (not the default GITHUB_TOKEN) so the @copilot mention
          # is posted as a real user with write access. The Copilot coding
          # agent does NOT start a session when mentioned by github-actions[bot].
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const FAILED = new Set([
              'failure', 'timed_out', 'cancelled', 'startup_failure', 'action_required',
            ]);

            // ── helpers ────────────────────────────────────────────────
            const isApproved = async (prNumber) => {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: prNumber,
              });
              const latest = new Map();
              for (const r of reviews) if (r.user) latest.set(r.user.login, r);
              const arr = [...latest.values()];
              return {
                approved: arr.some((r) => r.state === 'APPROVED'),
                blocked: arr.some((r) => r.state === 'CHANGES_REQUESTED'),
              };
            };

            const enableAutoMerge = async (prNumber) => {
              const { repository } = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!){
                   repository(owner:$o,name:$r){
                     pullRequest(number:$n){ id autoMergeRequest{ enabledAt } }
                   }
                 }`,
                { o: owner, r: repo, n: prNumber },
              );
              const node = repository?.pullRequest;
              if (!node) return;
              if (node.autoMergeRequest) {
                core.info(`    ✅ auto-merge already enabled.`);
                return;
              }
              try {
                await github.graphql(
                  `mutation($id:ID!){
                     enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){
                       pullRequest{ number }
                     }
                   }`,
                  { id: node.id },
                );
                core.info(`    🔓 enabled auto-merge.`);
              } catch (err) {
                core.warning(`    ⚠️  could not enable auto-merge: ${err.message}`);
              }
            };

            const reRunFailedWorkflows = async (headSha) => {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: headSha, per_page: 100,
              });
              const latestByWorkflow = new Map();
              for (const r of runs.workflow_runs) {
                const prev = latestByWorkflow.get(r.workflow_id);
                if (!prev || r.run_number > prev.run_number) latestByWorkflow.set(r.workflow_id, r);
              }
              let retried = 0;
              for (const run of latestByWorkflow.values()) {
                if (run.status !== 'completed') continue;
                if (!FAILED.has(run.conclusion)) continue;
                try {
                  await github.rest.actions.reRunWorkflowFailedJobs({
                    owner, repo, run_id: run.id,
                  });
                  retried++;
                  core.info(`    🔁 re-ran "${run.name}" (run ${run.id}, ${run.conclusion}).`);
                } catch (err) {
                  core.warning(`    ⚠️  could not re-run "${run.name}" (${run.id}): ${err.message}`);
                }
              }
              return retried;
            };

            const checkState = async (headSha) => {
              const { data: { check_runs } } = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, per_page: 100, filter: 'latest',
              });
              const stillRunning = check_runs.some(
                (c) => c.status === 'queued' || c.status === 'in_progress',
              );
              const failed = check_runs.filter(
                (c) => c.status === 'completed' && FAILED.has(c.conclusion),
              );
              return { check_runs, stillRunning, failed };
            };

            const collectDiagnostics = async (failed) => {
              const sections = [];
              for (const check of failed) {
                let body = `#### ❌ ${check.name} — \`${check.conclusion}\`\n`;
                if (check.html_url) body += `[View run](${check.html_url})\n\n`;

                if (check.output?.title) body += `**${check.output.title}**\n\n`;
                if (check.output?.summary) {
                  body += check.output.summary.slice(0, 1500) + '\n\n';
                }
                try {
                  const { data: ann } = await github.rest.checks.listAnnotations({
                    owner, repo, check_run_id: check.id, per_page: 20,
                  });
                  if (ann.length) {
                    body += `<details><summary>Annotations (${ann.length})</summary>\n\n`;
                    for (const a of ann.slice(0, 15)) {
                      const loc = a.path ? `\`${a.path}\`${a.start_line ? `:${a.start_line}` : ''}` : '';
                      body += `- **${a.annotation_level || 'notice'}** ${loc} — ${(a.message || '').slice(0, 300)}\n`;
                    }
                    body += `\n</details>\n\n`;
                  }
                } catch (err) {
                  core.warning(`    ⚠️  listAnnotations("${check.name}"): ${err.message}`);
                }
                sections.push(body);
              }
              return sections.join('\n').slice(0, 60000);
            };

            const processPR = async (pr) => {
              if (pr.draft) {
                core.info(`⏭️  PR #${pr.number}: draft.`);
                return;
              }
              const headSha = pr.head.sha;
              const short = headSha.slice(0, 7);
              core.info(`\n── PR #${pr.number} @ ${short} (${pr.title}) ──`);

              const { stillRunning, failed } = await checkState(headSha);

              if (stillRunning) {
                core.info(`    ⏳ checks still running — will be re-evaluated on the next event.`);
                // Still ensure auto-merge is on so green checks merge automatically.
                const { approved, blocked } = await isApproved(pr.number);
                if (approved && !blocked) await enableAutoMerge(pr.number);
                return;
              }

              if (failed.length === 0) {
                core.info(`    ✅ all checks green.`);
                const { approved, blocked } = await isApproved(pr.number);
                if (approved && !blocked) await enableAutoMerge(pr.number);
                return;
              }

              core.info(`    ❌ ${failed.length} failed check(s): ${failed.map((f) => f.name).join(', ')}`);

              // Make sure auto-merge is on so a successful re-run / fix merges immediately.
              const { approved, blocked } = await isApproved(pr.number);
              if (approved && !blocked) await enableAutoMerge(pr.number);

              // 1. Re-run failed workflow jobs (cheap flake recovery).
              await reRunFailedWorkflows(headSha);

              // 2. Ping @copilot with diagnostics — once per head SHA (avoid spam).
              const NUDGE_MARKER = `<!-- pr-unblock:nudge:${short} -->`;
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              if (comments.some((c) => c.body.includes(NUDGE_MARKER))) {
                core.info(`    💤 already pinged @copilot for ${short} — waiting for new commit.`);
                return;
              }

              const diagnostics = await collectDiagnostics(failed);
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  NUDGE_MARKER,
                  `@copilot The required checks are failing on \`${short}\`. ` +
                    `Auto-merge is enabled and the PR is approved — the **only** thing standing ` +
                    `between this PR and \`main\` is the red checks below. Please diagnose the ` +
                    `root cause and push a fix to this branch. I'll keep pinging on every new ` +
                    `commit until everything is green and the PR merges.`,
                  '',
                  '### How to fix',
                  '1. Read the failure details below; open the linked runs for full logs.',
                  '2. Reproduce locally with `pnpm check` and `pnpm build`.',
                  '3. Fix the **root cause** — no `--no-verify`, no skipping tests.',
                  '4. Push the fix. A new run will retry/ping again if anything is still red.',
                  '',
                  '### Failure details',
                  '',
                  diagnostics,
                ].join('\n'),
              });
              core.info(`    🚨 pinged @copilot with diagnostics.`);
            };

            // ── target selection ──────────────────────────────────────
            // For PR-scoped events, process only that PR. Otherwise walk all open PRs.
            const eventPRNumber =
              context.payload.pull_request?.number ||
              context.payload.check_suite?.pull_requests?.[0]?.number;

            let targets;
            if (eventPRNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: eventPRNumber,
              });
              targets = [pr];
            } else {
              const { data } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100,
              });
              targets = data;
            }

            if (targets.length === 0) {
              core.info('No PRs to process.');
              return;
            }

            for (const pr of targets) {
              try {
                await processPR(pr);
              } catch (err) {
                core.warning(`PR #${pr.number}: unexpected error: ${err.stack || err.message}`);
              }
            }
