name: Deploy

# Unified deploy pipeline for the web app and Sanity content/studio.
#
# The SAME five steps run for every trigger and for each environment:
#   1. Deploy Sanity migration scripts / content     (if needed)
#   2. Deploy Vercel web infra via Terraform         (if needed)
#   3. Deploy the Vercel web app as a staged build    (if needed)
#   4. Run E2E tests against the staged/preview deploy
#   5. Promote the staged deployment to production    (push to main only)
#
# Flow:
#   - pull_request  → run steps 1-4 for `development` (Vercel preview /
#                     staged deploy, Sanity content kept out of the live
#                     dataset). Step 5 (promotion) is skipped.
#   - push to main  → run steps 1-5 for `development`, then — once the
#                     whole development cycle is green — re-dispatch this
#                     workflow with `environment=production` so the SAME
#                     five steps run again for production.
#   - workflow_dispatch → run the five steps for the chosen environment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - production
        default: development

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    name: Check for changes
    outputs:
      sanity-changed: ${{ steps.check.outputs.sanity-changed }}
      infra-changed: ${{ steps.check.outputs.infra-changed }}
      app-changed: ${{ steps.check.outputs.app-changed }}
      environment: ${{ steps.resolve-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve environment
        id: resolve-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "Environment: ${{ github.event.inputs.environment }}"
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "Environment: development (${{ github.event_name }} trigger)"
          fi

      - name: Check for changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sanity-changed=true" >> $GITHUB_OUTPUT
            echo "infra-changed=true" >> $GITHUB_OUTPUT
            echo "app-changed=true" >> $GITHUB_OUTPUT
            echo "Manual trigger — deploying everything"
            exit 0
          fi

          if git diff --name-only HEAD~1 -- \
            apps/sanity-studio/ \
            ":(glob)apps/web/scripts/create-blog-*.ts" \
            apps/web/scripts/verify-blog-posts.ts \
            apps/web/src/lib/blog-posts/ \
            apps/web/public/images/blog/ | grep -q .; then
            echo "sanity-changed=true" >> $GITHUB_OUTPUT
            echo "Sanity content/studio changes detected"
          else
            echo "sanity-changed=false" >> $GITHUB_OUTPUT
            echo "No Sanity content/studio changes"
          fi

          if git diff --name-only HEAD~1 -- infra/vercel/web/ | grep -q .; then
            echo "infra-changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in infra/vercel/web/"
          else
            echo "infra-changed=false" >> $GITHUB_OUTPUT
            echo "No changes in infra/vercel/web/"
          fi

          if git diff --name-only HEAD~1 -- apps/web/ apps/web-e2e/ | grep -q .; then
            echo "app-changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in apps/web/ or apps/web-e2e/"
          else
            echo "app-changed=false" >> $GITHUB_OUTPUT
            echo "No changes in apps/web/ or apps/web-e2e/"
          fi

  # ---------------------------------------------------------------------------
  # STEP 1 — Deploy Sanity migration scripts / content (if needed)
  # ---------------------------------------------------------------------------
  # On pull requests the live `production` dataset is left untouched (Sanity
  # content stays as draft / out of the published dataset); the published
  # content is deployed only on push to main and manual runs.
  sanity-deploy:
    needs: check-changes
    if: |
      always() &&
      needs.check-changes.outputs.sanity-changed == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy Sanity content
    env:
      SANITY_TARGET_DATASETS: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Sanity content migrations
        run: |
          node apps/sanity-studio/scripts/fix-ortoqueratologia-seo.mjs || echo "fix-ortoqueratologia-seo.mjs failed"
          node apps/sanity-studio/scripts/fix-terapia-visual-sections.mjs || echo "fix-terapia-visual-sections.mjs failed"
        env:
          SANITY_EDITOR_TOKEN: ${{ secrets.SANITY_EDITOR_TOKEN }}
        continue-on-error: true

      - name: Publish canonical blog posts to Sanity
        run: pnpm --filter opticasuarez-web run sync:canonical-blog-posts
        env:
          SANITY_EDITOR_TOKEN: ${{ secrets.SANITY_EDITOR_TOKEN }}
          SANITY_TARGET_DATASETS: ${{ env.SANITY_TARGET_DATASETS }}

      - name: Verify canonical blog posts are published
        run: pnpm --filter opticasuarez-web run verify:canonical-blog-posts
        env:
          SANITY_EDITOR_TOKEN: ${{ secrets.SANITY_EDITOR_TOKEN }}
          SANITY_TARGET_DATASETS: ${{ env.SANITY_TARGET_DATASETS }}

      - name: Deploy Sanity Studio
        run: pnpm --filter opticasuarez-sanity-studio run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_STUDIO_TOKEN }}
          SANITY_STUDIO_GITHUB_DEPLOY_TOKEN: ${{ secrets.SANITY_STUDIO_GITHUB_DEPLOY_TOKEN }}

  # ---------------------------------------------------------------------------
  # STEP 2 — Deploy Vercel web infra via Terraform (if needed)
  # ---------------------------------------------------------------------------
  infra-deploy:
    needs: [check-changes, sanity-deploy]
    if: |
      always() &&
      needs.sanity-deploy.result != 'failure' &&
      needs.check-changes.outputs.infra-changed == 'true'
    runs-on: ubuntu-latest
    name: Infrastructure Deploy
    permissions:
      contents: write
    outputs:
      project-id: ${{ steps.export-outputs.outputs.project-id || steps.pr-project-id.outputs.project-id }}
    env:
      TF_VAR_ENVIRONMENT: ${{ needs.check-changes.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt infra env vars
        run: |
          npm install -g @dotenvx/dotenvx
          ENVIRONMENT="${{ needs.check-changes.outputs.environment }}"
          ENV_FILE="infra/vercel/web/.env.${ENVIRONMENT}"

          # Infra-specific vars → TF_VAR_ prefixed + direct env
          for key in VERCEL_TOKEN TERRAFORM_STATE_ENCRYPT_KEY; do
            value=$(dotenvx get "$key" -f "$ENV_FILE" 2>/dev/null || echo "")
            echo "TF_VAR_${key}=${value}" >> $GITHUB_ENV
            echo "${key}=${value}" >> $GITHUB_ENV
            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
            fi
          done

          # VERCEL_ORG_ID → only for Vercel CLI (not Terraform team parameter)
          VERCEL_ORG_ID=$(dotenvx get "VERCEL_ORG_ID" -f "$ENV_FILE" 2>/dev/null || echo "")
          echo "VERCEL_ORG_ID=${VERCEL_ORG_ID}" >> $GITHUB_ENV
          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "::add-mask::${VERCEL_ORG_ID}"
          fi

          # App env vars → TF_VAR_ prefixed (pushed to Vercel by Terraform)
          for key in VITE_BASE_URL RESEND_API_KEY SANITY_PROJECT_ID SANITY_DATASET SANITY_API_TOKEN SANITY_WEBHOOK_SECRET SANITY_PREVIEW_SECRET GITHUB_DEPLOY_TOKEN; do
            value=$(dotenvx get "$key" -f "$ENV_FILE" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "TF_VAR_${key}=${value}" >> $GITHUB_ENV
              echo "::add-mask::${value}"
            fi
          done
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_DEVELOPMENT }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_PRODUCTION }}

      - name: Fetch Terraform State from state branch
        working-directory: infra/vercel/web/src
        run: |
          STATE_FILE="terraform-${{ env.TF_VAR_ENVIRONMENT }}.tfstate.enc"
          if git fetch origin terraform-state 2>/dev/null; then
            if git show "origin/terraform-state:infra/vercel/web/src/${STATE_FILE}" > "$STATE_FILE" 2>/dev/null && [ -s "$STATE_FILE" ]; then
              echo "State file fetched from terraform-state branch (new path)"
            elif git show "origin/terraform-state:infra/vercel/src/${STATE_FILE}" > "$STATE_FILE" 2>/dev/null && [ -s "$STATE_FILE" ]; then
              echo "State file fetched from terraform-state branch (legacy path)"
            else
              rm -f "$STATE_FILE"
              echo "State file not found on terraform-state branch"
            fi
          else
            echo "terraform-state branch does not exist yet"
          fi

      - name: Decrypt Terraform State
        working-directory: infra/vercel/web/src
        run: |
          STATE_FILE="terraform-${{ env.TF_VAR_ENVIRONMENT }}.tfstate.enc"
          if [ -s "$STATE_FILE" ]; then
            if echo "$TERRAFORM_STATE_ENCRYPT_KEY" | openssl enc -aes-256-cbc -d -in "$STATE_FILE" -out "terraform.tfstate" -pass stdin 2>/dev/null; then
              echo "State file decrypted"
            else
              echo "::warning::Failed to decrypt state file — proceeding without existing state"
              rm -f terraform.tfstate
            fi
          else
            echo "No existing state file found"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/vercel/web/src
        run: terraform init

      - name: Import existing project if state is missing
        working-directory: infra/vercel/web/src
        continue-on-error: true
        run: |
          if [ ! -f "terraform.tfstate" ] || [ "$(jq '.resources | length' terraform.tfstate 2>/dev/null)" = "0" ]; then
            ENVIRONMENT="${{ needs.check-changes.outputs.environment }}"
            case "$ENVIRONMENT" in
              development) ENV_SHORT="dev" ;;
              production)  ENV_SHORT="prod" ;;
              *)           ENV_SHORT="${ENVIRONMENT:0:3}" ;;
            esac
            PROJECT_NAME="opticasuarez-web-${ENV_SHORT}"
            echo "No state found. Checking for existing project: $PROJECT_NAME"
            TEAM_PARAM=""
            if [ -n "${TF_VAR_VERCEL_ORG_ID}" ]; then
              TEAM_PARAM="?teamId=${TF_VAR_VERCEL_ORG_ID}"
            fi
            PROJECT_ID=$(curl -sf -H "Authorization: ******" "https://api.vercel.com/v9/projects/${PROJECT_NAME}${TEAM_PARAM}" | jq -r '.id // empty')
            if [ -n "$PROJECT_ID" ]; then
              echo "Found existing project $PROJECT_ID — importing into state"
              terraform import -var-file="config.${ENVIRONMENT}.json" vercel_project.main "$PROJECT_ID"
            else
              echo "No existing project found, proceeding with fresh creation"
            fi
          fi

      - name: Terraform Plan
        working-directory: infra/vercel/web/src
        run: terraform plan -var-file="config.${{ env.TF_VAR_ENVIRONMENT }}.json" -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        id: export-outputs
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: |
          PROJECT_ID=$(terraform output -raw OPTICASUAREZ_WEB_VERCEL_PROJECT_ID)
          echo "Vercel Project ID: $PROJECT_ID"
          echo "project-id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "Set OPTICASUAREZ_WEB_VERCEL_PROJECT_ID variable manually to: $PROJECT_ID"

      - name: Resolve project id for PR runs
        id: pr-project-id
        if: github.event_name == 'pull_request'
        run: |
          echo "project-id=${{ vars.OPTICASUAREZ_WEB_VERCEL_PROJECT_ID }}" >> $GITHUB_OUTPUT

      - name: Encrypt Terraform State
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: |
          if [ -f "terraform.tfstate" ]; then
            echo "$TERRAFORM_STATE_ENCRYPT_KEY" | openssl enc -aes-256-cbc -in "terraform.tfstate" -out "terraform-${{ env.TF_VAR_ENVIRONMENT }}.tfstate.enc" -pass stdin
            rm -f terraform.tfstate
            echo "State file encrypted successfully"
          else
            echo "Error: No terraform.tfstate file found to encrypt"
            exit 1
          fi

      - name: Configure Git
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Encrypted State to state branch
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: |
          STATE_FILE="terraform-${{ env.TF_VAR_ENVIRONMENT }}.tfstate.enc"
          cp "$STATE_FILE" "/tmp/$STATE_FILE"

          cd ${{ github.workspace }}
          if git fetch origin terraform-state 2>/dev/null; then
            git checkout terraform-state
          else
            git checkout --orphan terraform-state
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p infra/vercel/web/src
          cp "/tmp/$STATE_FILE" "infra/vercel/web/src/$STATE_FILE"
          git add "infra/vercel/web/src/$STATE_FILE"
          git diff --staged --quiet && echo "No changes to state file" && exit 0
          git commit -m "chore: update terraform state for ${{ env.TF_VAR_ENVIRONMENT }} environment"
          git push origin terraform-state
          echo "State file committed to terraform-state branch"

  # ---------------------------------------------------------------------------
  # STEP 3 — Deploy the Vercel web app as a staged build (if needed)
  # ---------------------------------------------------------------------------
  # The deployment is created with `--skip-domain`, so it is never assigned
  # to the environment's production domains until STEP 5 promotes it. This is
  # what provides the Vercel "preview" behaviour on PRs and the "staged"
  # deployment on push.
  deploy-web:
    needs: [check-changes, sanity-deploy, infra-deploy]
    if: |
      always() &&
      needs.sanity-deploy.result != 'failure' &&
      needs.infra-deploy.result != 'failure' &&
      (needs.check-changes.outputs.app-changed == 'true' || needs.check-changes.outputs.infra-changed == 'true')
    runs-on: ubuntu-latest
    name: Deploy web (staged)
    outputs:
      deploy-url: ${{ steps.deploy.outputs.deploy-url }}
    env:
      VERCEL_PROJECT_ID: ${{ needs.infra-deploy.outputs.project-id || vars.OPTICASUAREZ_WEB_VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt infra env vars
        run: |
          npm install -g @dotenvx/dotenvx
          ENVIRONMENT="${{ needs.check-changes.outputs.environment }}"
          for key in VERCEL_TOKEN VERCEL_ORG_ID; do
            value=$(dotenvx get "$key" -f "infra/vercel/web/.env.${ENVIRONMENT}" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "${key}=${value}" >> $GITHUB_ENV
              echo "::add-mask::${value}"
            fi
          done
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_DEVELOPMENT }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_PRODUCTION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

      - name: Build Artifacts
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          NITRO_PRESET: vercel

      - name: Deploy staged build to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --skip-domain --token=$VERCEL_TOKEN)
          echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Staged deploy URL: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

  # ---------------------------------------------------------------------------
  # STEP 4 — Run E2E tests against the staged/preview deployment
  # ---------------------------------------------------------------------------
  e2e-tests:
    needs: [deploy-web]
    if: always() && needs.deploy-web.result == 'success'
    runs-on: ubuntu-latest
    name: E2E Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter opticasuarez-web-e2e exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm --filter opticasuarez-web-e2e test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-web.outputs.deploy-url }}
          PLAYWRIGHT_WORKERS: 2
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: true

  # ---------------------------------------------------------------------------
  # STEP 5 — Promote the staged deployment to production (push to main only)
  # ---------------------------------------------------------------------------
  promote:
    needs: [check-changes, infra-deploy, deploy-web, e2e-tests]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.deploy-web.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      needs.infra-deploy.result != 'failure'
    runs-on: ubuntu-latest
    name: Promote staged deployment
    environment: ${{ needs.check-changes.outputs.environment }}
    env:
      VERCEL_PROJECT_ID: ${{ needs.infra-deploy.outputs.project-id || vars.OPTICASUAREZ_WEB_VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt infra env vars
        run: |
          npm install -g @dotenvx/dotenvx
          ENVIRONMENT="${{ needs.check-changes.outputs.environment }}"
          for key in VERCEL_TOKEN VERCEL_ORG_ID; do
            value=$(dotenvx get "$key" -f "infra/vercel/web/.env.${ENVIRONMENT}" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "${key}=${value}" >> $GITHUB_ENV
              echo "::add-mask::${value}"
            fi
          done
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_DEVELOPMENT }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_PRODUCTION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Promote staged deployment to production
        run: |
          DEPLOY_URL="${{ needs.deploy-web.outputs.deploy-url }}"
          echo "Promoting $DEPLOY_URL to production for ${{ needs.check-changes.outputs.environment }}"
          vercel promote "$DEPLOY_URL" --token=$VERCEL_TOKEN
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

  # ---------------------------------------------------------------------------
  # After the development cycle finishes (steps 1-5 green on push to main),
  # re-dispatch this workflow with environment=production so the SAME five
  # steps run again for the production environment.
  # ---------------------------------------------------------------------------
  run-production:
    needs: [check-changes, sanity-deploy, infra-deploy, deploy-web, e2e-tests, promote]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.check-changes.outputs.environment == 'development' &&
      needs.deploy-web.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      needs.promote.result == 'success' &&
      needs.infra-deploy.result != 'failure' &&
      needs.sanity-deploy.result != 'failure'
    runs-on: ubuntu-latest
    name: Run the same steps for production
    steps:
      - name: Trigger production deploy
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run deploy.yml --ref main -f environment=production
          echo "Dispatched deploy.yml with environment=production"

  # ---------------------------------------------------------------------------
  # PR gating + summary (pull requests only)
  # ---------------------------------------------------------------------------
  pr-merge-gate:
    needs: [check-changes, sanity-deploy, infra-deploy, deploy-web, e2e-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Merge Gate

    steps:
      - name: Validate full PR workflow
        run: |
          echo "check-changes: ${{ needs.check-changes.result }}"
          echo "sanity-deploy: ${{ needs.sanity-deploy.result }}"
          echo "infra-deploy: ${{ needs.infra-deploy.result }}"
          echo "deploy-web: ${{ needs.deploy-web.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.check-changes.result }}" != "success" ]; then
            echo "check-changes must succeed"
            exit 1
          fi

          if [ "${{ needs.infra-deploy.result }}" != "success" ] && [ "${{ needs.infra-deploy.result }}" != "skipped" ]; then
            echo "infra-deploy must succeed (or be skipped when infra is unchanged)"
            exit 1
          fi

          if [ "${{ needs.deploy-web.result }}" != "success" ] && [ "${{ needs.deploy-web.result }}" != "skipped" ]; then
            echo "deploy-web must succeed (or be skipped when no app/infra changes)"
            exit 1
          fi

          if [ "${{ needs.deploy-web.result }}" = "success" ] && [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "e2e-tests must succeed when the staged deployment succeeds"
            exit 1
          fi

  pr-workflow-summary:
    needs: [check-changes, sanity-deploy, infra-deploy, deploy-web, e2e-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Update PR with Workflow Summary
    permissions:
      pull-requests: write

    steps:
      - name: Generate workflow summary
        uses: actions/github-script@v7
        with:
          script: |-
            const sanityStatus = '${{ needs.sanity-deploy.result }}';
            const infraStatus = '${{ needs.infra-deploy.result }}';
            const deployStatus = '${{ needs.deploy-web.result }}';
            const e2eStatus = '${{ needs.e2e-tests.result }}';
            const deployUrl = '${{ needs.deploy-web.outputs.deploy-url }}';

            const statusEmoji = {
              success: '✅',
              skipped: '⏭️',
              failure: '❌',
              cancelled: '⚪'
            };

            const getSummaryRow = (label, status, details) => {
              const emoji = statusEmoji[status] || '❓';
              const statusText = status === 'success' ? 'Applied' : status === 'skipped' ? 'Skipped' : 'Failed';
              return `| **${label}** | ${emoji} ${statusText} | ${details} |`;
            };

            const deployDetails = deployStatus === 'success' && deployUrl
              ? `[Preview](${deployUrl})`
              : 'No preview URL available';

            const summaryLines = [
              '## Deployment Workflow Summary',
              '',
              '| Step | Status | Details |',
              '|------|--------|---------|',
              getSummaryRow('Sanity Content', sanityStatus, 'Migrations / canonical content'),
              getSummaryRow('Infrastructure Changes', infraStatus, 'Terraform plan/apply'),
              getSummaryRow('Deploy Web (staged)', deployStatus, deployDetails),
              getSummaryRow('E2E Tests', e2eStatus, 'Playwright tests against preview'),
              '',
              '---'
            ];
            const summary = summaryLines.join('\n');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let newBody = pr.body || '';
            const summaryMarker = '## Deployment Workflow Summary';

            if (newBody.includes(summaryMarker)) {
              const lines = newBody.split('\n');
              let startIdx = -1;
              let endIdx = lines.length;

              for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes(summaryMarker)) {
                  startIdx = i;
                }
                if (startIdx !== -1 && i > startIdx && lines[i].startsWith('## ') && !lines[i].includes(summaryMarker)) {
                  endIdx = i;
                  break;
                }
              }

              if (startIdx !== -1) {
                newBody = lines.slice(0, startIdx).join('\n') + '\n' + summary + (endIdx < lines.length ? '\n' + lines.slice(endIdx).join('\n') : '');
              }
            } else {
              newBody = newBody + '\n\n' + summary;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: newBody
            });
