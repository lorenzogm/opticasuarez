name: Deploy

# Single-environment deploy pipeline (production) for the web app and Sanity.
#
#   - pull_request  → deploy a Vercel PREVIEW of the branch, run E2E tests
#                     against it and post the preview URL on the PR. Nothing
#                     touches production (Sanity and Terraform apply are
#                     skipped; Terraform only runs `plan`).
#   - push to main  → (i.e. the PR was merged) deploy Sanity content, apply
#                     the Terraform infra and deploy the web app straight to
#                     production.
#   - workflow_dispatch → same as push to main, deploying everything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    name: Check for changes
    outputs:
      sanity-changed: ${{ steps.check.outputs.sanity-changed }}
      infra-changed: ${{ steps.check.outputs.infra-changed }}
      app-changed: ${{ steps.check.outputs.app-changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sanity-changed=true" >> $GITHUB_OUTPUT
            echo "infra-changed=true" >> $GITHUB_OUTPUT
            echo "app-changed=true" >> $GITHUB_OUTPUT
            echo "Manual trigger — deploying everything"
            exit 0
          fi

          if git diff --name-only HEAD~1 -- \
            apps/sanity-studio/ \
            ":(glob)apps/web/scripts/create-blog-*.ts" \
            apps/web/scripts/verify-blog-posts.ts \
            apps/web/src/lib/blog-posts/ \
            apps/web/public/images/blog/ | grep -q .; then
            echo "sanity-changed=true" >> $GITHUB_OUTPUT
            echo "Sanity content/studio changes detected"
          else
            echo "sanity-changed=false" >> $GITHUB_OUTPUT
            echo "No Sanity content/studio changes"
          fi

          if git diff --name-only HEAD~1 -- infra/vercel/web/ | grep -q .; then
            echo "infra-changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in infra/vercel/web/"
          else
            echo "infra-changed=false" >> $GITHUB_OUTPUT
            echo "No changes in infra/vercel/web/"
          fi

          if git diff --name-only HEAD~1 -- apps/web/ apps/web-e2e/ | grep -q .; then
            echo "app-changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in apps/web/ or apps/web-e2e/"
          else
            echo "app-changed=false" >> $GITHUB_OUTPUT
            echo "No changes in apps/web/ or apps/web-e2e/"
          fi

  # ---------------------------------------------------------------------------
  # Deploy Sanity migration scripts / content (if needed)
  # ---------------------------------------------------------------------------
  # On pull requests the live `production` dataset is left untouched (Sanity
  # content stays as draft / out of the published dataset); the published
  # content is deployed only on push to main and manual runs.
  sanity-deploy:
    needs: check-changes
    if: |
      always() &&
      needs.check-changes.outputs.sanity-changed == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy Sanity content
    env:
      SANITY_TARGET_DATASETS: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Sanity content migrations
        run: |
          node apps/sanity-studio/scripts/fix-ortoqueratologia-seo.mjs || echo "fix-ortoqueratologia-seo.mjs failed"
          node apps/sanity-studio/scripts/fix-terapia-visual-sections.mjs || echo "fix-terapia-visual-sections.mjs failed"
        env:
          SANITY_EDITOR_TOKEN: ${{ secrets.SANITY_EDITOR_TOKEN }}
        continue-on-error: true

      - name: Publish canonical blog posts to Sanity
        run: pnpm --filter opticasuarez-web run sync:canonical-blog-posts
        env:
          SANITY_EDITOR_TOKEN: ${{ secrets.SANITY_EDITOR_TOKEN }}
          SANITY_TARGET_DATASETS: ${{ env.SANITY_TARGET_DATASETS }}

      - name: Verify canonical blog posts are published
        run: pnpm --filter opticasuarez-web run verify:canonical-blog-posts
        env:
          SANITY_EDITOR_TOKEN: ${{ secrets.SANITY_EDITOR_TOKEN }}
          SANITY_TARGET_DATASETS: ${{ env.SANITY_TARGET_DATASETS }}

      - name: Deploy Sanity Studio
        run: pnpm --filter opticasuarez-sanity-studio run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_STUDIO_TOKEN }}
          SANITY_STUDIO_GITHUB_DEPLOY_TOKEN: ${{ secrets.SANITY_STUDIO_GITHUB_DEPLOY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy Vercel web infra via Terraform (if needed)
  # ---------------------------------------------------------------------------
  infra-deploy:
    needs: [check-changes, sanity-deploy]
    if: |
      always() &&
      needs.sanity-deploy.result != 'failure' &&
      needs.check-changes.outputs.infra-changed == 'true'
    runs-on: ubuntu-latest
    name: Infrastructure Deploy
    permissions:
      contents: write
    outputs:
      project-id: ${{ steps.export-outputs.outputs.project-id || steps.pr-project-id.outputs.project-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt infra env vars
        run: |
          npm install -g @dotenvx/dotenvx
          ENV_FILE="infra/vercel/web/.env.production"

          # Infra-specific vars → TF_VAR_ prefixed + direct env
          for key in VERCEL_TOKEN TERRAFORM_STATE_ENCRYPT_KEY; do
            value=$(dotenvx get "$key" -f "$ENV_FILE" 2>/dev/null || echo "")
            echo "TF_VAR_${key}=${value}" >> $GITHUB_ENV
            echo "${key}=${value}" >> $GITHUB_ENV
            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
            fi
          done

          # VERCEL_ORG_ID → only for Vercel CLI (not Terraform team parameter)
          VERCEL_ORG_ID=$(dotenvx get "VERCEL_ORG_ID" -f "$ENV_FILE" 2>/dev/null || echo "")
          echo "VERCEL_ORG_ID=${VERCEL_ORG_ID}" >> $GITHUB_ENV
          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "::add-mask::${VERCEL_ORG_ID}"
          fi

          # App env vars → TF_VAR_ prefixed (pushed to Vercel by Terraform)
          for key in VITE_BASE_URL RESEND_API_KEY SANITY_PROJECT_ID SANITY_DATASET SANITY_API_TOKEN SANITY_WEBHOOK_SECRET SANITY_PREVIEW_SECRET GITHUB_DEPLOY_TOKEN; do
            value=$(dotenvx get "$key" -f "$ENV_FILE" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "TF_VAR_${key}=${value}" >> $GITHUB_ENV
              echo "::add-mask::${value}"
            fi
          done
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_PRODUCTION }}

      - name: Fetch Terraform State from state branch
        working-directory: infra/vercel/web/src
        run: |
          STATE_FILE="terraform-production.tfstate.enc"
          if git fetch origin terraform-state 2>/dev/null; then
            if git show "origin/terraform-state:infra/vercel/web/src/${STATE_FILE}" > "$STATE_FILE" 2>/dev/null && [ -s "$STATE_FILE" ]; then
              echo "State file fetched from terraform-state branch (new path)"
            elif git show "origin/terraform-state:infra/vercel/src/${STATE_FILE}" > "$STATE_FILE" 2>/dev/null && [ -s "$STATE_FILE" ]; then
              echo "State file fetched from terraform-state branch (legacy path)"
            else
              rm -f "$STATE_FILE"
              echo "State file not found on terraform-state branch"
            fi
          else
            echo "terraform-state branch does not exist yet"
          fi

      - name: Decrypt Terraform State
        working-directory: infra/vercel/web/src
        run: |
          STATE_FILE="terraform-production.tfstate.enc"
          if [ -s "$STATE_FILE" ]; then
            if echo "$TERRAFORM_STATE_ENCRYPT_KEY" | openssl enc -aes-256-cbc -d -in "$STATE_FILE" -out "terraform.tfstate" -pass stdin 2>/dev/null; then
              echo "State file decrypted"
            else
              echo "::warning::Failed to decrypt state file — proceeding without existing state"
              rm -f terraform.tfstate
            fi
          else
            echo "No existing state file found"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/vercel/web/src
        run: terraform init

      - name: Import existing project if state is missing
        working-directory: infra/vercel/web/src
        continue-on-error: true
        run: |
          if [ ! -f "terraform.tfstate" ] || [ "$(jq '.resources | length' terraform.tfstate 2>/dev/null)" = "0" ]; then
            PROJECT_NAME="opticasuarez-web-prod"
            echo "No state found. Checking for existing project: $PROJECT_NAME"
            TEAM_PARAM=""
            if [ -n "${TF_VAR_VERCEL_ORG_ID}" ]; then
              TEAM_PARAM="?teamId=${TF_VAR_VERCEL_ORG_ID}"
            fi
            PROJECT_ID=$(curl -sf -H "Authorization: ******" "https://api.vercel.com/v9/projects/${PROJECT_NAME}${TEAM_PARAM}" | jq -r '.id // empty')
            if [ -n "$PROJECT_ID" ]; then
              echo "Found existing project $PROJECT_ID — importing into state"
              terraform import -var-file="config.json" vercel_project.main "$PROJECT_ID"
            else
              echo "No existing project found, proceeding with fresh creation"
            fi
          fi

      - name: Terraform Plan
        working-directory: infra/vercel/web/src
        run: terraform plan -var-file="config.json" -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        id: export-outputs
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: |
          PROJECT_ID=$(terraform output -raw OPTICASUAREZ_WEB_VERCEL_PROJECT_ID)
          echo "Vercel Project ID: $PROJECT_ID"
          echo "project-id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "Set OPTICASUAREZ_WEB_VERCEL_PROJECT_ID variable manually to: $PROJECT_ID"

      - name: Resolve project id for PR runs
        id: pr-project-id
        if: github.event_name == 'pull_request'
        run: |
          echo "project-id=${{ vars.OPTICASUAREZ_WEB_VERCEL_PROJECT_ID }}" >> $GITHUB_OUTPUT

      - name: Encrypt Terraform State
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: |
          if [ -f "terraform.tfstate" ]; then
            echo "$TERRAFORM_STATE_ENCRYPT_KEY" | openssl enc -aes-256-cbc -in "terraform.tfstate" -out "terraform-production.tfstate.enc" -pass stdin
            rm -f terraform.tfstate
            echo "State file encrypted successfully"
          else
            echo "Error: No terraform.tfstate file found to encrypt"
            exit 1
          fi

      - name: Configure Git
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Encrypted State to state branch
        if: github.event_name != 'pull_request'
        working-directory: infra/vercel/web/src
        run: |
          STATE_FILE="terraform-production.tfstate.enc"
          cp "$STATE_FILE" "/tmp/$STATE_FILE"

          cd ${{ github.workspace }}
          if git fetch origin terraform-state 2>/dev/null; then
            git checkout terraform-state
          else
            git checkout --orphan terraform-state
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p infra/vercel/web/src
          cp "/tmp/$STATE_FILE" "infra/vercel/web/src/$STATE_FILE"
          git add "infra/vercel/web/src/$STATE_FILE"
          git diff --staged --quiet && echo "No changes to state file" && exit 0
          git commit -m "chore: update terraform state"
          git push origin terraform-state
          echo "State file committed to terraform-state branch"

  # ---------------------------------------------------------------------------
  # Deploy the Vercel web app
  # ---------------------------------------------------------------------------
  # Pull requests get a Vercel preview deployment; pushes to main (merged PRs)
  # and manual runs deploy straight to production.
  deploy-web:
    needs: [check-changes, sanity-deploy, infra-deploy]
    if: |
      always() &&
      needs.sanity-deploy.result != 'failure' &&
      needs.infra-deploy.result != 'failure' &&
      (needs.check-changes.outputs.app-changed == 'true' || needs.check-changes.outputs.infra-changed == 'true')
    runs-on: ubuntu-latest
    name: ${{ github.event_name == 'pull_request' && 'Deploy to Vercel Preview' || 'Deploy to Vercel Production' }}
    outputs:
      deploy-url: ${{ steps.deploy.outputs.deploy-url }}
    env:
      VERCEL_PROJECT_ID: ${{ needs.infra-deploy.outputs.project-id }}
      PREVIEW_VERCEL_PROJECT_ID: ${{ vars.OPTICASUAREZ_WEB_VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt infra env vars
        run: |
          npm install -g @dotenvx/dotenvx
          for key in VERCEL_TOKEN VERCEL_ORG_ID; do
            value=$(dotenvx get "$key" -f "infra/vercel/web/.env.production" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "${key}=${value}" >> $GITHUB_ENV
              echo "::add-mask::${value}"
            fi
          done
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_INFRA_PRODUCTION }}

      - name: Resolve Vercel project ID
        run: |
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using Vercel project ID from Terraform"
            exit 0
          fi

          if [ "$VERCEL_TARGET" = "preview" ]; then
            PROJECT_ID="$PREVIEW_VERCEL_PROJECT_ID"
          else
            TEAM_PARAM=""
            if [ -n "$VERCEL_ORG_ID" ]; then
              TEAM_PARAM="?teamId=$VERCEL_ORG_ID"
            fi
            PROJECT_ID=$(curl -sf --oauth2-bearer "$VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/opticasuarez-web-prod${TEAM_PARAM}" |
              jq -r '.id // empty')
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Failed to resolve Vercel project ID for $VERCEL_TARGET"
            exit 1
          fi

          echo "::add-mask::$PROJECT_ID"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Resolved Vercel project ID for $VERCEL_TARGET"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=$VERCEL_TARGET --token=$VERCEL_TOKEN
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

      - name: Build Artifacts
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            vercel build --prod --token=$VERCEL_TOKEN
          else
            vercel build --token=$VERCEL_TOKEN
          fi
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          NITRO_PRESET: vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          fi
          echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed ($VERCEL_TARGET): $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}

      - name: Verify production tests page
        if: env.VERCEL_TARGET == 'production'
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS https://opticasuarezjaen.es/tests | grep -q "Tests visuales online"; then
              echo "Production /tests page is available"
              exit 0
            fi
            echo "Waiting for production /tests page (attempt $attempt/12)"
            sleep 5
          done

          echo "::error::Production domain did not serve the /tests page after deployment"
          exit 1

  # ---------------------------------------------------------------------------
  # Run E2E tests against the preview deployment (pull requests only)
  # ---------------------------------------------------------------------------
  e2e-tests:
    needs: [deploy-web]
    if: always() && github.event_name == 'pull_request' && needs.deploy-web.result == 'success'
    # Playwright 1.52 does not support the Ubuntu 26.04 image behind ubuntu-latest
    runs-on: ubuntu-24.04
    name: E2E Tests on Preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter opticasuarez-web-e2e exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm --filter opticasuarez-web-e2e test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-web.outputs.deploy-url }}
          PLAYWRIGHT_WORKERS: 2
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: true

  # ---------------------------------------------------------------------------
  # PR gating + preview comment (pull requests only)
  # ---------------------------------------------------------------------------
  pr-merge-gate:
    needs: [check-changes, sanity-deploy, infra-deploy, deploy-web, e2e-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Merge Gate

    steps:
      - name: Validate full PR workflow
        run: |
          echo "check-changes: ${{ needs.check-changes.result }}"
          echo "infra-deploy: ${{ needs.infra-deploy.result }}"
          echo "deploy-web: ${{ needs.deploy-web.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.check-changes.result }}" != "success" ]; then
            echo "check-changes must succeed"
            exit 1
          fi

          if [ "${{ needs.infra-deploy.result }}" != "success" ] && [ "${{ needs.infra-deploy.result }}" != "skipped" ]; then
            echo "infra-deploy must succeed (or be skipped when infra is unchanged)"
            exit 1
          fi

          if [ "${{ needs.deploy-web.result }}" != "success" ] && [ "${{ needs.deploy-web.result }}" != "skipped" ]; then
            echo "deploy-web must succeed (or be skipped when no app/infra changes)"
            exit 1
          fi

          if [ "${{ needs.deploy-web.result }}" = "success" ] && [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "e2e-tests must succeed when the preview deployment succeeds"
            exit 1
          fi

  pr-preview-comment:
    needs: [deploy-web, e2e-tests]
    if: always() && github.event_name == 'pull_request' && needs.deploy-web.result != 'skipped'
    runs-on: ubuntu-latest
    name: Comment preview URL on PR
    permissions:
      pull-requests: write

    steps:
      - name: Create or update preview comment
        uses: actions/github-script@v7
        env:
          DEPLOY_STATUS: ${{ needs.deploy-web.result }}
          E2E_STATUS: ${{ needs.e2e-tests.result }}
          DEPLOY_URL: ${{ needs.deploy-web.outputs.deploy-url }}
        with:
          script: |
            const { DEPLOY_STATUS, E2E_STATUS, DEPLOY_URL } = process.env;
            const marker = '<!-- vercel-preview -->';
            const icon = (status) =>
              ({ success: '✅', failure: '❌', cancelled: '⚪', skipped: '⏭️' })[status] || '❓';

            const body = [
              marker,
              '## 🔎 Vercel preview',
              '',
              DEPLOY_STATUS === 'success' && DEPLOY_URL
                ? `**Preview:** ${DEPLOY_URL}`
                : '❌ The preview deployment failed.',
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Deploy preview | ${icon(DEPLOY_STATUS)} ${DEPLOY_STATUS} |`,
              `| E2E tests | ${icon(E2E_STATUS)} ${E2E_STATUS} |`,
              '',
              `_Updated for ${context.sha.slice(0, 7)}. Merging this PR deploys to production._`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
